---
# Non-secret configuration. Safe to commit. Secrets live in vault.yml
# (see vault.yml.example in this directory) and are referenced below as
# vault_*.

# --- where the app lives on the Pi -------------------------------------------
ikea_energy_app_dir: /opt/ikeaenergy

# Source tree to deploy. Defaults to "the project directory this playbook
# lives under" (deploy/ansible/../..), synced over rsync -- no git remote
# required. If you push this repo to a git remote later, swap the
# "Sync project files" task in playbook.yml for git: with this URL instead.
ikea_energy_local_src: "{{ playbook_dir }}/../.."

# Host timezone. Matters twice over: the systemd timer's OnCalendar below is
# evaluated in the HOST's local time, and the report itself renders
# timestamps using the container's TZ (set the same value here and it
# threads through to both).
ikea_energy_tz: Europe/Stockholm

# systemd OnCalendar expression for the scheduled report.
# Syntax reference: man 7 systemd.time
ikea_energy_schedule: "*-*-* 08:00:00"

# --- report thresholds --------------------------------------------------------
battery_critical_pct: 20
battery_warning_pct: 40
stale_hours: 24
report_site_name: Home

# --- gateway -------------------------------------------------------------------
tradfri_host: 192.168.1.50
tradfri_identity: ikea_energy
tradfri_transport: auto
tradfri_timeout: 10

# --- email ---------------------------------------------------------------------
email_backend: smtp            # smtp | ses
email_from: ikea-reports@example.com
email_from_name: IKEA Energy
email_to: you@example.com
email_cc: ""
email_reply_to: ""
email_subject_prefix: "[IKEA Energy]"

# smtp (Gmail) -- only read when email_backend: smtp
smtp_host: smtp.gmail.com
smtp_port: 587
smtp_starttls: true
smtp_username: ikea-reports@example.com
smtp_timeout: 30

# ses -- only read when email_backend: ses
aws_region: us-east-1
aws_profile: ""
ses_configuration_set: ""
