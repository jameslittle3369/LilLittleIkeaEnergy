[defaults]
inventory = inventory.ini
roles_path = roles
# The Pi's host key changes if you ever re-flash the SD card. Leaving key
# checking on (the default) means the first connection prompts you to confirm
# the fingerprint -- accept that prompt rather than disabling this.
retry_files_enabled = False

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False
