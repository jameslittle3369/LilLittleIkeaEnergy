---
# Deploys ikea_energy.py to a Raspberry Pi 4 running Debian as a Docker
# image, plus a systemd timer to run it on schedule.
#
# Bullseye ships Python 3.9, which the app's dependencies (recent
# matplotlib in particular) have outgrown -- rather than fight the host's
# Python, this playbook installs Docker and ships the app inside the image
# built from the repo's own Dockerfile, which pins its own Python 3.14.
# The Pi's system Python is never touched.
#
# One-time bootstrap this playbook deliberately does NOT do: gateway
# pairing. --pair exchanges the sticker security code for a PSK, and the
# gateway only issues that once per identity -- doing it from a playbook
# that might re-run would risk hitting "PSK already set" on every apply.
# Pair manually after the first deploy (see the README section this
# playbook is documented under), then put the PSK in vault.yml and re-run.
#
# Usage:
#   ansible-galaxy collection install -r requirements.yml
#   cp group_vars/raspberrypi/vault.yml.example group_vars/raspberrypi/vault.yml
#   ansible-vault encrypt group_vars/raspberrypi/vault.yml
#   # edit inventory.ini and group_vars/raspberrypi/vars.yml for your setup
#   ansible-playbook playbook.yml --ask-vault-pass
#
# Must run from a POSIX controller (WSL2, Linux, macOS) -- ansible-core's
# control node does not run on native Windows.

- name: Deploy ikea_energy.py to the Raspberry Pi
  hosts: raspberrypi
  become: true

  vars:
    docker_arch_map:
      aarch64: arm64
      armv7l: armhf
      x86_64: amd64

  tasks:
    - name: Confirm this is a 64-bit host (aarch64)
      ansible.builtin.assert:
        that: ansible_architecture == "aarch64"
        fail_msg: >-
          {{ inventory_hostname }} reports {{ ansible_architecture }}, not aarch64.
          matplotlib/numpy/pillow publish no armv7l wheels for the Python this
          image uses, so the Docker build would try to compile them from source
          and likely exhaust RAM on a 32-bit Pi. Reflash with 64-bit Raspberry
          Pi OS / Debian, or see README.md "Raspberry Pi 4" for the tradeoffs.
        success_msg: "64-bit host confirmed ({{ ansible_architecture }})"

    - name: Set the host timezone
      ansible.builtin.command: timedatectl set-timezone {{ ikea_energy_tz }}
      register: tz_result
      changed_when: "'Warning' not in tz_result.stderr and tz_result.rc == 0"
      # timedatectl is idempotent on its own (no-op if already set); this
      # changed_when just avoids Ansible reporting "changed" on every run.

    # --------------------------------------------------------------------- #
    # Docker Engine (official apt repo -- Debian's own docker.io package
    # lags behind and is missing the compose plugin on bullseye).
    # --------------------------------------------------------------------- #

    - name: Install packages needed to add the Docker apt repo
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg, rsync]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Fetch Docker's apt signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
        force: false   # already-fetched key is fine; don't refetch every run

    - name: Add the Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ docker_arch_map[ansible_architecture] }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/debian
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Install Docker Engine and the Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Add {{ ansible_user }} to the docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
      # Lets you run `docker compose ...` by hand over SSH without sudo.
      # Log out/in (or start a fresh SSH session) for group membership to
      # take effect; the systemd units below always run as root regardless.

    - name: Enable and start Docker
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started

    # --------------------------------------------------------------------- #
    # Application files
    # --------------------------------------------------------------------- #

    - name: Create the app directory
      ansible.builtin.file:
        path: "{{ ikea_energy_app_dir }}"
        state: directory
        mode: "0755"

    - name: Sync project files
      ansible.posix.synchronize:
        src: "{{ ikea_energy_local_src }}/"
        dest: "{{ ikea_energy_app_dir }}/"
        delete: true
        rsync_opts:
          - "--exclude=.git/"
          - "--exclude=.venv/"
          - "--exclude=__pycache__/"
          - "--exclude=out/"
          - "--exclude=deploy/"
          - "--exclude=.env"
          - "--exclude=.env.*"
          - "--exclude=*.pyc"
      # Runs over the controller's SSH connection, so no separate rsync
      # daemon or extra port is needed on the Pi -- ansible.posix.synchronize
      # tunnels through the same connection ansible_host already uses.

    - name: Render the production .env
      ansible.builtin.template:
        src: templates/env.j2
        dest: "{{ ikea_energy_app_dir }}/.env"
        mode: "0600"
        owner: root
        group: root
      no_log: true   # the rendered diff would otherwise print secrets to the console

    - name: Ensure the report output directory exists
      ansible.builtin.file:
        path: "{{ ikea_energy_app_dir }}/out"
        state: directory
        mode: "0755"

    - name: Build the image
      ansible.builtin.command:
        cmd: docker compose build
        chdir: "{{ ikea_energy_app_dir }}"
      register: build_result
      changed_when: true   # `docker compose build` has no clean idempotent signal
                            # to key off; every run is reported changed. Harmless --
                            # Docker's own layer cache still makes an unchanged
                            # source tree a fast no-op build.

    - name: Smoke test -- render a demo report inside the built image
      ansible.builtin.command:
        cmd: docker compose run --rm ikea-energy --demo --json --quiet
        chdir: "{{ ikea_energy_app_dir }}"
      changed_when: false
      register: demo_result
      failed_when: demo_result.rc != 0

    # --------------------------------------------------------------------- #
    # Scheduling (systemd timer, not cron -- --fail-on-alert then shows up
    # as a failed unit in `systemctl --failed` and journald for free).
    # --------------------------------------------------------------------- #

    - name: Install the report service unit
      ansible.builtin.template:
        src: templates/ikea-energy-report.service.j2
        dest: /etc/systemd/system/ikea-energy-report.service
        mode: "0644"
      notify: reload systemd

    - name: Install the report timer unit
      ansible.builtin.template:
        src: templates/ikea-energy-report.timer.j2
        dest: /etc/systemd/system/ikea-energy-report.timer
        mode: "0644"
      notify: reload systemd

    - name: Flush handlers so the timer install below sees the new units
      ansible.builtin.meta: flush_handlers

    - name: Enable and start the timer
      ansible.builtin.systemd_service:
        name: ikea-energy-report.timer
        enabled: true
        state: started

    - name: Show when the next scheduled report will run
      ansible.builtin.command: systemctl list-timers ikea-energy-report.timer --no-pager
      changed_when: false
      register: next_run

    - name: Next run
      ansible.builtin.debug:
        var: next_run.stdout_lines

  handlers:
    - name: reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
