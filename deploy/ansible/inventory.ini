# Point this at your Pi. `ansible_user` needs passwordless sudo (the default
# `pi`/first-boot user on Raspberry Pi OS and most Debian installer setups has
# this via /etc/sudoers.d/010_pi-nopasswd -- confirm with:
#   ssh pi@<host> sudo -n true && echo OK
# If that fails, add --ask-become-pass to your ansible-playbook invocations.

[raspberrypi]
pi4 ansible_host=192.168.1.60 ansible_user=pi

[raspberrypi:vars]
ansible_python_interpreter=/usr/bin/python3
